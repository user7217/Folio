<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save to ReaderKB</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #FAF8F5;
      color: #181615;
    }
    label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 8px 12px; background: #8B261D; color: #FFFFFF; border: 0; cursor: pointer; }
    .status { margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:16px;margin-top:0;">ReaderKB Capture</h1>
    <label for="instance-url">Instance URL</label>
    <input id="instance-url" type="url" value="http://localhost:3000" />
    <label for="pairing-code">Short-Lived Pairing Code</label>
    <input id="pairing-code" type="text" placeholder="pair_..." />
    <button id="pair-btn" type="button">Pair Extension</button>
    <hr />
    <button id="capture-btn" type="button">Save Current Tab</button>
    <p id="status-msg" class="status" role="status">Ready</p>
  </main>
</body>
</html>
